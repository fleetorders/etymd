# The checks the local pre-push hook runs, plus the build, the self-audit and a pack dry-run.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # etymd checks its own instruction files with the command the README tells users to run in CI.
      - name: etymd audit (self)
        run: node dist/cli.js audit --no-ledger --fail-on risk
      # npm pack ignores .gitignore, so a stray local file can ship while every git-scoped check
      # stays green. The tarball's top level must match this exact list.
      - name: pack dry-run (what would ship)
        run: |
          npm pack --pack-destination /tmp >/dev/null
          tar -tzf /tmp/etymd-*.tgz | sed 's|^package/||' | cut -d/ -f1 | sort -u > /tmp/shipped
          printf 'CHANGELOG.md\nLICENSE\nREADME.md\ndist\npackage.json\n' > /tmp/expected
          diff /tmp/expected /tmp/shipped || {
            echo "::error::tarball contents differ from the expected manifest above"; exit 1; }
